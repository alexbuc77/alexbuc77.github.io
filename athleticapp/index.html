<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restbeat</title>
<!-- Dirección vieja de la app (Athleticapp). Lleva a la nueva conservando el link de los mails (search y hash). -->
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (new URL(r.scope).pathname.startsWith('/athleticapp/')) r.unregister(); }));
  location.replace('/' + location.search + location.hash);
</script>
</head><body style="font-family:system-ui;padding:24px">La app ahora se llama Restbeat. <a href="/">Abrir Restbeat</a> · The app is now called Restbeat. <a href="/">Open Restbeat</a></body></html>
